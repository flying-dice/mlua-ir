[workspace]
resolver = "3"
members = ["crates/mlua-ir", "crates/mlua-ir-macros", "crates/mlua-ir-gen", "demo"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
repository = "https://github.com/flying-dice/mlua-ir"
license = "MIT"

[workspace.dependencies]
mlua = { version = "0.12.2", features = ["luau", "async", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inventory = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
thiserror = "2"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
serde-reflection = "0.5"
bollard-stubs = { version = "=1.52.1-rc.29.1.3", default-features = false }
mlua-ir = { path = "crates/mlua-ir" }
mlua-ir-macros = { path = "crates/mlua-ir-macros" }
mlua-ir-gen = { path = "crates/mlua-ir-gen" }
